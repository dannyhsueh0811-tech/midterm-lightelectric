<section id="home" class="panel hero"><h1>準備好挑戰了嗎？</h1><p class="muted">完全依照上傳題庫的100題題幹設計；原卷沒有選項，這裡的5個選項是為練習額外編寫的。答題後立即顯示解析。</p><div class="grid"><div class="stat"><span class="muted tiny">題庫總數</span><strong>100</strong></div><div class="stat"><span class="muted tiny">光學</span><strong>50</strong></div><div class="stat"><span class="muted tiny">LED</span><strong>30</strong></div><div class="stat"><span class="muted tiny">太陽電池</span><strong>20</strong></div></div>

<script id="data" type="application/json">[{"id": 1, "unit": "光學基礎與半導體光學", "q": "當光學系統的特徵尺度 D 遠大於光波長 λ 時（即 λ → 0 的極限），以下哪種物理現象可以被忽略，因而適用幾何光學模型？", "answer": "繞射效應", "wrong": ["光的直線傳播", "反射定律", "折射定律", "光程的概念"], "why": "波長遠小於系統尺度時，繞射可近似忽略。"}, {"id": 2, "unit": "光學基礎與半導體光學", "q": "根據惠更斯原理（Huygens' Principle），宏觀光線的傳播在微觀上的物理本質為何？", "answer": "每個波前點產生次級波，包絡面形成新波前", "wrong": ["光子永遠保持直線運動", "光只沿法線傳播", "只有介面會產生波", "波前無法互相疊加"], "why": "惠更斯原理以次級波描述波前向前推進。"}, {"id": 3, "unit": "光學基礎與半導體光學", "q": "關於幾何光學符號約定（Sign Convention）與司乃耳定律，當角度轉向法線時，其正負號約定為何？", "answer": "須依有向角符號約定；常見約定朝法線為負", "wrong": ["永遠為正值", "永遠為零", "與折射率成正比", "所有教科書皆規定為正"], "why": "正負號依符號系統；司乃耳定律常以非負夾角表示。"}, {"id": 4, "unit": "光學基礎與半導體光學", "q": "在光路建模中，若欲將反射定律（θ₁ = θ₂）歸併入折射定律公式（n₁ · sin(θ₁) = n₂ · sin(θ₂)）中，可引入何種數學抽象概念？", "answer": "引入負折射率的形式化數學概念", "wrong": ["令兩側折射率都等於零", "令入射角為90°", "把光速設成無限大", "取消角度符號"], "why": "以虛擬負折射率搭配有向角，可把反射形式上寫成折射關係。"}, {"id": 5, "unit": "光學基礎與半導體光學", "q": "當光由光密介質（折射率 n₁）射向光疏介質（折射率 n₂）時，發生全反射（TIR）的臨界角 θ_c 公式為何？", "answer": "θc = asin(n₂/n₁)，且 n₁ > n₂", "wrong": ["θc = asin(n₁/n₂)", "θc = n₁/n₂", "θc = 90°－n₂", "θc = acos(n₁n₂)"], "why": "折射角達90°時，司乃耳定律給出 sin θc=n₂/n₁。"}, {"id": 6, "unit": "光學基礎與半導體光學", "q": "在全反射介面處，雖然巨觀上能量被完全反射，但波前會滲透入光疏介質幾何邊界內，形成何種特殊的波？", "answer": "衰減波（Evanescent wave）", "wrong": ["駐波", "縱波", "聲波", "激波"], "why": "全反射時低折射率側存在隨距離指數衰減的場。"}, {"id": 7, "unit": "光學基礎與半導體光學", "q": "費馬原理（Fermat's Principle）的現代精確定義為「平穩時間原理」，其數學條件為何？", "answer": "δT = 0（等價 δOPL = 0）", "wrong": ["T = 0", "δT > 0 必然成立", "T 一定是全域最小值", "光程必須是零"], "why": "實際光路對微小變分呈平穩，不必然是最短。"}, {"id": 8, "unit": "光學基礎與半導體光學", "q": "在完善成像系統（Stigmatic Imaging System）中，物點到像點之間所有實際光路的光程（OPL）滿足何種極值條件？", "answer": "各實際成像光路為等光程", "wrong": ["光程全部為零", "光程全部不同且隨機", "只需最長路徑", "光程與折射率無關"], "why": "理想完善成像要求由同一物點至像點有相同光程。"}, {"id": 9, "unit": "光學基礎與半導體光學", "q": "在特定曲率的凹面鏡內部反射成像中，實際光路的光程相較於鄰近虛擬路徑呈現何種特性，但仍滿足 δL = 0？", "answer": "局部光程極大值", "wrong": ["一定是全域最小值", "光程為零", "光程沒有平穩值", "光程必定無限大"], "why": "平穩路徑也可能是極大值，而非只能是極小值。"}, {"id": 10, "unit": "光學基礎與半導體光學", "q": "光纖通訊（Fiber Optics）能夠達成數千公里低損耗傳輸，其核心（Core, n₁）與包覆層（Cladding, n₂）的折射率關係為何？", "answer": "n核心 > n包覆", "wrong": ["n核心 < n包覆", "n核心 = n包覆", "兩者都必須小於零", "兩者需交替變化"], "why": "較高折射率的核心有利於利用全反射導光。"}, {"id": 11, "unit": "光學基礎與半導體光學", "q": "光學式指紋辨識模組利用稜鏡 TIR 的敏感度，當皮膚的「脊線（Ridges）」接觸玻璃介面時，會產生何種物理效應？", "answer": "受挫全反射（FTIR）", "wrong": ["光電效應", "光致發光", "布拉格繞射", "熱輻射"], "why": "皮膚接觸改變界面條件，造成原本全反射的光被耦合或散射。"}, {"id": 12, "unit": "光學基礎與半導體光學", "q": "在光束分類中，若光線不匯聚於單一點，而是呈現非對稱性的聚焦缺陷，稱為何種光束？", "answer": "像散光束（Astigmatic beam）", "wrong": ["平面波", "理想球面波", "準直光束", "單一焦點光束"], "why": "兩正交方向焦點不一致是像散的典型特徵。"}, {"id": 13, "unit": "光學基礎與半導體光學", "q": "光學設計初階運算採用的「近軸近似（Paraxial Approximation）」，其數學假設為何？", "answer": "sinθ≈tanθ≈θ、cosθ≈1（θ為弧度小角）", "wrong": ["sinθ≈1", "tanθ≈90°", "cosθ≈0", "θ 必須接近180°"], "why": "近軸小角度使光路公式線性化。"}, {"id": 14, "unit": "光學基礎與半導體光學", "q": "同一物點發出的不同孔徑角光線經透鏡折射後，因光程不一致無法會聚於同點的現象，稱為何種像差？", "answer": "球面像差", "wrong": ["色差", "偏振", "雙折射", "全反射"], "why": "透鏡邊緣與近軸光線聚焦位置不同，形成球面像差。"}, {"id": 15, "unit": "光學基礎與半導體光學", "q": "當人眼觀察水中物體時，因光線自水（n = 1.33）進入空氣（n = 1.00）發生折射，大腦沿直線追跡會產生何種光學錯覺？", "answer": "物體看起來比實際更淺", "wrong": ["物體完全消失", "物體看起來必定更深", "物體變成倒立實像", "物體波長變成零"], "why": "折射光反向延伸造成視深小於實際深度。"}, {"id": 16, "unit": "光學基礎與半導體光學", "q": "光學材料的「複數折射率」表示為 N = n + j · k，其中虛部 k 代表何種物理意義？", "answer": "消光係數，反映光吸收衰減", "wrong": ["介質密度", "光的頻率", "物體尺寸", "光源亮度"], "why": "複數折射率虛部表徵光在介質內的衰減。"}, {"id": 17, "unit": "光學基礎與半導體光學", "q": "消色差雙合透鏡（Achromatic Doublet）通常結合哪兩種不同色散特性的玻璃來互相抵消色差？", "answer": "冕牌玻璃與火石玻璃", "wrong": ["兩塊完全相同的玻璃", "純水與空氣", "矽與鍺", "兩片偏光片"], "why": "利用不同色散特性抵消部分色差。"}, {"id": 18, "unit": "光學基礎與半導體光學", "q": "當半導體製程尺度縮小至與光波長可比擬時，幾何光學失效，必須採用物理光學，其核心在於探討光的何種特性？", "answer": "波動性：干涉、繞射與相位", "wrong": ["只有直線運動", "只研究熱傳", "只研究質量", "只研究流體壓力"], "why": "尺度接近波長時，波動效應不可忽略。"}, {"id": 19, "unit": "光學基礎與半導體光學", "q": "兩束頻率相同、振動方向相同的光波重疊時，產生「建設性干涉」的相位差條件為何？", "answer": "Δφ = 2mπ（m為整數）", "wrong": ["Δφ = (2m+1)π", "Δφ = π/2", "Δφ 必須隨機", "Δφ = 3π/2"], "why": "同相位疊加形成建設性干涉。"}, {"id": 20, "unit": "光學基礎與半導體光學", "q": "產生穩定光學干涉條紋的三大相干性（Coherence）必要條件不包括以下哪一項？", "answer": "兩束光強度必須完全相等", "wrong": ["相位差穩定", "頻率相同或足夠接近", "有相同偏振分量", "具有時間相干性"], "why": "強度相等能提升對比，但不是穩定干涉的必要條件。原題未提供選項，此為模擬非必要條件。"}, {"id": 21, "unit": "光學基礎與半導體光學", "q": "在感測器設計中，利用同調光（如雷射）進行精準相位調控，主要工程目的為何？", "answer": "精密位移、距離或形貌量測", "wrong": ["增加材料電阻", "把紅光變成藍光", "抑制所有折射", "讓光不再傳播"], "why": "微小位移能轉為可量測的相位差。"}, {"id": 22, "unit": "光學基礎與半導體光學", "q": "當光自光疏介質（n₁）射向光密介質（n₂，n₁ < n₂）介面並發生反射時，反射光會產生何種相位突變？", "answer": "反射相位跳變π（180°）", "wrong": ["完全不變", "跳變π/4", "跳變4π", "只改變頻率不改變相位"], "why": "由低n往高n界面反射，在一般正入射情形有π相位反轉。"}, {"id": 23, "unit": "光學基礎與半導體光學", "q": "單層抗反射膜（AR Coating, 鍍膜折射率 n_f）設計中，為了透過破壞性干涉消除反射，其理論最小膜厚 t 為何？", "answer": "t = λ₀/(4n_f)", "wrong": ["t = λ₀/n_f", "t = 4λ₀n_f", "t = λ₀/2", "t = n_f/λ₀"], "why": "垂直入射時四分之一波長膜使反射光破壞性干涉；完全消反射還需適當折射率。"}, {"id": 24, "unit": "光學基礎與半導體光學", "q": "光纖通訊中的分波多工濾光片（WDM Filter）是利用何種物理結構實現超窄帶通濾波？", "answer": "多層介電質薄膜干涉結構", "wrong": ["單一導線", "機械齒輪", "半導體散熱片", "真空管"], "why": "多層膜精細設計可選擇特定波長通過。"}, {"id": 25, "unit": "光學基礎與半導體光學", "q": "半導體曝光機進行晶圓載台（Wafer Stage）奈米級精密定位時，核心採用的量測設備為何？", "answer": "雷射干涉儀", "wrong": ["溫度計", "伏特計", "音量計", "磁力計"], "why": "干涉相位改變可用於奈米級位移量測。"}, {"id": 26, "unit": "光學基礎與半導體光學", "q": "關於單狹縫繞射圖樣，其中央明帶的寬度與其餘相鄰明帶寬度相比為何？", "answer": "中央主明帶約為旁邊明帶寬度的兩倍", "wrong": ["寬度完全相同", "中央最窄", "中央寬度為零", "中央寬度必為十倍"], "why": "單狹縫繞射第一暗紋之間形成較寬中央主極大。"}, {"id": 27, "unit": "光學基礎與半導體光學", "q": "圓形孔徑透鏡產生的繞射艾里斑（Airy Disk）限制了系統最小解析距離 Δl，根據瑞利判據（Rayleigh Criterion），其公式為何？", "answer": "Δl = 0.61λ/NA", "wrong": ["Δl = 0.61NA/λ", "Δl = λ×NA", "Δl = NA²/λ", "Δl = 1/λ²"], "why": "圓孔徑瑞利判據，波長短且NA大有利於解析。"}, {"id": 28, "unit": "光學基礎與半導體光學", "q": "光學系統的數值孔徑（Numerical Aperture, NA）定義公式為何？（其中 n 為介質折射率，θ 為最大半孔徑角）", "answer": "NA = n sinθ", "wrong": ["NA = n/cosθ", "NA = θ/n", "NA = λ/n", "NA = n + θ"], "why": "NA 由介質折射率與最大半孔徑角決定。"}, {"id": 29, "unit": "光學基礎與半導體光學", "q": "先進半導體浸潤式微影（Immersion Lithography）在透鏡與晶圓間注入純水（n ≈ 1.44），其提升解析度的物理機制為何？", "answer": "提高介質折射率以增加NA", "wrong": ["讓光的真空波長變長", "降低光源功率", "消除所有像差", "把晶圓變厚"], "why": "浸潤液提高可達數值孔徑，有利於細線寬解析。"}, {"id": 30, "unit": "光學基礎與半導體光學", "q": "當前半導體極紫外光（EUV）微影技術所使用的戰略光源波長 λ 為何？", "answer": "13.5 nm", "wrong": ["193 nm", "365 nm", "550 nm", "1.55 μm"], "why": "先進EUV微影使用約13.5奈米波長。"}, {"id": 31, "unit": "光學基礎與半導體光學", "q": "智慧型手機 Face ID 3D 臉部辨識系統中，將單一紅外雷射光束分裂成 30,000 個高密度點陣的核心元件為何？", "answer": "繞射光學元件（DOE）", "wrong": ["傳統電阻器", "熱電偶", "一般平面鏡", "光纖接頭"], "why": "DOE把紅外光分成大量結構化投射點。"}, {"id": 32, "unit": "光學基礎與半導體光學", "q": "光學雷達（LiDAR）採用的 FMCW（調頻連續波）技術，相較於傳統 ToF，其精準測距主要依賴何種物理量？", "answer": "發射與回波之間的拍頻", "wrong": ["只有光源亮度", "鏡片厚度", "電池內阻", "光子的靜止質量"], "why": "FMCW藉由頻率掃描與回波混頻得到測距資訊。"}, {"id": 33, "unit": "光學基礎與半導體光學", "q": "全像防偽技術（Holography）利用雷射的相干性，能夠同時記錄光波的哪兩種資訊？", "answer": "振幅與相位", "wrong": ["只有溫度與壓力", "只有光速與質量", "只有電子與電洞", "只有電阻與電容"], "why": "全像利用干涉條紋編碼光波的振幅與相位。"}, {"id": 34, "unit": "光學基礎與半導體光學", "q": "當電晶體線寬縮小至 2 nm 節點時，電子展現波動性穿越極薄閘極能障造成漏電的現象稱為何者？", "answer": "量子穿隧效應", "wrong": ["光電導效應", "全反射", "色散", "熱對流"], "why": "電子能以機率穿越經典上無法跨越的薄能障。"}, {"id": 35, "unit": "光學基礎與半導體光學", "q": "半導體晶體中，孤立原子的離散能階之所以會分裂並密集交疊形成「能帶（Energy Bands）」，主因為何？", "answer": "原子靠近時電子波函數交疊與能階分裂", "wrong": ["電子完全靜止", "原子全部失去電子", "晶體只剩一個原子", "光速降低"], "why": "大量原子作用使密集能階形成能帶。"}, {"id": 36, "unit": "光學基礎與半導體光學", "q": "半導體材料的「能隙（Bandgap, E_g）」定義為何？其數值一般介於何種範圍？", "answer": "導帶底與價帶頂的能量差，典型約0.1至數eV", "wrong": ["導帶內電子總數", "材料厚度", "光的折射角", "永遠等於零的能量"], "why": "能隙決定帶間吸收與發光的基本能量尺度。"}, {"id": 37, "unit": "光學基礎與半導體光學", "q": "當價帶電子獲得能量躍遷至導帶後，在價帶留下的未填滿空態，在物理上可等效為何種粒子？", "answer": "帶正電的準粒子：電洞", "wrong": ["質子", "中子", "光子", "聲子"], "why": "價帶缺少一個電子的狀態可用電洞描述。"}, {"id": 38, "unit": "光學基礎與半導體光學", "q": "在半導體中，外加電場作用下，導帶電子與價帶電洞的定向移動所產生的總電流稱為何者？", "answer": "漂移電流", "wrong": ["擴散電流（僅由濃度梯度產生）", "位移電流", "熱輻射電流", "聲電流"], "why": "外電場驅動載子定向移動稱為漂移。"}, {"id": 39, "unit": "光學基礎與半導體光學", "q": "光電檢測器（Photodetector）運作的核心物理機制為「光吸收」，其發生的能量前提條件為何？", "answer": "光子能量 hν ≥ Eg", "wrong": ["hν < Eg", "hν = 0", "光子必須沒有動量", "能隙必須無限大"], "why": "理想帶間吸收要求光子能量不小於能隙。"}, {"id": 40, "unit": "光學基礎與半導體光學", "q": "半導體發光元件（如 LED 與雷射）運作的核心物理機制為「電子-電洞複合」，此過程伴隨何種能量轉換？", "answer": "電子電洞輻射複合，能量以光子釋放", "wrong": ["光子轉成重力", "只會產生聲波", "電荷完全消失", "材料必然變成金屬"], "why": "LED/雷射使用輻射複合將電子能轉為光。"}, {"id": 41, "unit": "光學基礎與半導體光學", "q": "發光二極體（LED）產生的非相干光源，其發光機制屬於下列何者？", "answer": "自發輻射", "wrong": ["受激吸收", "核分裂", "湮滅輻射", "布拉格反射"], "why": "LED通常藉由自發輻射產生較低相干性光。"}, {"id": 42, "unit": "光學基礎與半導體光學", "q": "半導體雷射（Semiconductor Laser）能發射同相位、同方向高相干光源，其發光機制屬於下列何者？", "answer": "受激輻射", "wrong": ["只有自發輻射", "熱對流", "光電吸收", "直接電阻發熱"], "why": "受激輻射配合光學回授可形成相干雷射。"}, {"id": 43, "unit": "光學基礎與半導體光學", "q": "直接能隙（Direct Bandgap）半導體（如 GaAs）之所以發光效率極高，其主要物理特徵為何？", "answer": "導帶底與價帶頂位於相同k值", "wrong": ["一定沒有能隙", "需要兩個聲子才能發光", "電洞完全不存在", "晶格常數等於零"], "why": "直接能隙可近乎不改變晶體動量而發光。"}, {"id": 44, "unit": "光學基礎與半導體光學", "q": "單質半導體矽（Si）與鍺（Ge）屬於間接能隙半導體，其電子躍遷發光效率極低的主因為何？", "answer": "帶間躍遷需要聲子輔助動量守恆", "wrong": ["因為沒有電子", "因為矽透明於所有波長", "因為光子沒有能量", "因為溫度必須是0 K"], "why": "間接能隙的動量差降低輻射複合機率。"}, {"id": 45, "unit": "光學基礎與半導體光學", "q": "在靠近能帶邊緣（導帶底或價帶頂）時，E-k 色散關係可近似為拋物線，電子的有效質量 m* 與曲率 d²E/dk² 的關係為何？", "answer": "m* = ℏ²/(d²E/dk²)", "wrong": ["m* = d²E/dk²", "m* = ℏ×k", "m* = 1/Eg", "m* = λ/n"], "why": "有效質量與能帶曲率成反比（簡化單一方向）。"}, {"id": 46, "unit": "光學基礎與半導體光學", "q": "砷化鎵（GaAs）的電子等效質量極小（m_e* ≈ 0.07 · m₀），這在 E-k 圖與元件效能上代表何種物理意義？", "answer": "E-k曲率大，載子易加速", "wrong": ["E-k曲率必為零", "電子完全不能移動", "能隙必為零", "材料必定是絕緣體"], "why": "有效質量小意味相同外力下加速度較大。"}, {"id": 47, "unit": "光學基礎與半導體光學", "q": "由於三維晶體在不同晶向上的原子排列與週期位能各異，等效質量在空間不同方向上必須定義為何種數學形式？", "answer": "二階張量（矩陣）", "wrong": ["單一無因次常數", "電阻值", "純量溫度", "光波長"], "why": "不同晶向曲率可不同，以有效質量張量描述。"}, {"id": 48, "unit": "光學基礎與半導體光學", "q": "在化合物半導體中，透過調控三元混晶（如 Al_xGa_1-xAs）或四元混晶（如 In_xGa_1-xAs_yP_1-y）的組分配比 (x, y) 來連續改變能隙與波長，此技術稱為？", "answer": "能隙工程（Bandgap engineering）", "wrong": ["熱退火", "全反射設計", "光學鍍膜", "電磁屏蔽"], "why": "改變合金組成可連續調整能隙與光學波長。"}, {"id": 49, "unit": "光學基礎與半導體光學", "q": "在 N 型矽半導體中摻雜五價元素（如 As、P）會引入施體能階 E_d，其游離能僅約 10 meV，在室溫 300 K（熱能 ≈ 26 meV）下呈現何種狀態？", "answer": "施體多數電離並提供導帶電子", "wrong": ["全部保持中性", "立刻變成P型", "導帶消失", "不可能導電"], "why": "題設10 meV淺施體在室溫易受熱激發。"}, {"id": 50, "unit": "光學基礎與半導體光學", "q": "有機半導體（如共軛高分子）之所以能導電與發光，其微觀結構中交替分布的單雙鍵產生的何種電子離域化（Delocalization）為核心？", "answer": "π電子離域化", "wrong": ["質子離域化", "中子裂變", "完全局域的核電子", "自由聲子聚集"], "why": "交替單雙鍵形成共軛π電子系統。"}, {"id": 51, "unit": "LED 原理與材料", "q": "關於發光二極體（LED）產生光子的主要物理機制，下列何者正確？", "answer": "順向注入載子後電子電洞輻射複合", "wrong": ["靠機械摩擦生光", "反向崩潰是所有LED正常發光基礎", "只靠散射", "只靠熱輻射"], "why": "LED由順向注入的載子在主動區複合發光。"}, {"id": 52, "unit": "LED 原理與材料", "q": "下列半導體材料中，何者屬於「直接能隙半導體」（Direct Bandgap Semiconductor），且最適合作為高效率發光元件之主動層？", "answer": "GaAs等直接能隙半導體", "wrong": ["Si", "Ge", "一般玻璃", "純銅"], "why": "直接能隙材料帶間輻射效率通常較高。"}, {"id": 53, "unit": "LED 原理與材料", "q": "直接能隙半導體之所以具備極高之發光效率，其最主要的量子力學物理原因為何？", "answer": "電子電洞可在相同k值直接複合", "wrong": ["能隙必為0", "需要聲子才能滿足動量守恆", "沒有任何非輻射過程", "沒有價帶"], "why": "直接能隙不必靠聲子補足主要晶體動量差。"}, {"id": 54, "unit": "LED 原理與材料", "q": "間接能隙半導體（如矽 Si、鍺 Ge）發光效率極低，其主要原因為何？", "answer": "帶間發光須聲子輔助動量守恆", "wrong": ["電子完全不運動", "材料沒有晶格", "不吸收任何光", "只能在真空發光"], "why": "間接能隙輻射機率相對低。"}, {"id": 55, "unit": "LED 原理與材料", "q": "pn 接面外加順向偏壓（Forward Bias）時，內部能帶與載子行為會發生何種變化？", "answer": "勢壘降低、空乏區縮小、注入載子增加", "wrong": ["勢壘升高", "空乏區無限增大", "電子與電洞消失", "電流必為零"], "why": "順向偏壓促使載子跨越接面並複合。"}, {"id": 56, "unit": "LED 原理與材料", "q": "若某 LED 發射峰值波長為 λ = 620 nm（紅光），根據簡化能隙估算公式（λ ≈ 1240 / Eg nm），其材料禁帶能隙 Eg 約為多少？", "answer": "約2.0 eV", "wrong": ["約0.5 eV", "約1.1 eV", "約3.4 eV", "約5.0 eV"], "why": "Eg≈1240/620=2.0 eV。"}, {"id": 57, "unit": "LED 原理與材料", "q": "藍光 LED 主要採用氮化鎵（GaN，Eg ≈ 3.4 eV）材料體系，其發光導通電壓（Turn-on Voltage, V_d）通常落在下列何者範圍？", "answer": "約3.0～3.5 V", "wrong": ["約0.1 V", "約0.6 V", "約12～15 V", "約100 V"], "why": "藍光GaN體系較大能隙，常見順向工作電壓約3V多。"}, {"id": 58, "unit": "LED 原理與材料", "q": "高折射率平面半導體晶片（如 GaAs，折射率 n ≈ 3.6）射向空氣（n = 1.0）介面時，其全反射臨界角 θ_c 約為多少？", "answer": "約16.1°", "wrong": ["約30°", "約45°", "約60°", "約89°"], "why": "θc=asin(1/3.6)≈16.1°。"}, {"id": 59, "unit": "LED 原理與材料", "q": "工業上常使用透明環氧樹脂（Epoxy Resin，折射率 n ≈ 1.5）進行「圓頂封裝」（Dome Encapsulation），其主要目的為何？", "answer": "增加光取出效率並降低全反射損失", "wrong": ["讓發光能隙變零", "讓LED永不發熱", "產生PN接面", "將紅光變成X光"], "why": "透明封裝改善光從高n晶片傳出。"}, {"id": 60, "unit": "LED 原理與材料", "q": "在磊晶成長（Epitaxy）過程中，「晶格匹配」（Lattice Matching）對於 LED 材料極為關鍵，若晶格失配率過大會產生何種後果？", "answer": "差排與缺陷增加，非輻射複合上升", "wrong": ["晶體更完美", "能隙永遠為零", "電流完全消失", "只會增加光速"], "why": "晶格失配易引發結構缺陷並降低效率。"}, {"id": 61, "unit": "LED 原理與材料", "q": "化合物半導體 GaAs 與 AlGaAs 體系被廣泛用於製造高品質異質接面，主要原因為下列何者？", "answer": "晶格常數近似、能隙可不同", "wrong": ["二者折射率必須為零", "只有其中一者可導電", "完全不含原子", "二者能隙必須相同"], "why": "晶格接近可降低失配，又能利用不同能隙限制載子。"}, {"id": 62, "unit": "LED 原理與材料", "q": "雙異質結構（Double Heterostructure, DH）二極體相比於傳統同質接面 LED，其最主要的物理優勢為何？", "answer": "同時限制載子與光場，提高效率", "wrong": ["取消所有PN接面", "增加載子外洩", "使光全部被吸收", "強迫電子不再複合"], "why": "雙異質結構利用能帶與折射率差將載子與光侷限在主動區。"}, {"id": 63, "unit": "LED 原理與材料", "q": "雙異質結構（DH）中，主動層（Active Layer）厚度通常設計在何種數量級？", "answer": "約0.1～1 μm", "wrong": ["約10 cm", "約1 m", "約100 μm至1 mm", "約10 m"], "why": "傳統DH主動層常在次微米量級；量子井可薄至奈米。"}, {"id": 64, "unit": "LED 原理與材料", "q": "LED 發出的光譜具有一定的光譜半高寬（FWHM / Δλ），其物理成因主要是因為導電帶電子的何種分佈特性？", "answer": "載子熱能與能量分布具有寬度", "wrong": ["所有光子能量完全相同", "只有電池串聯電阻", "只有機械振動頻率", "真空折射率變化"], "why": "不同能量載子複合造成發射光譜具有FWHM。"}, {"id": 65, "unit": "LED 原理與材料", "q": "當 LED 的工作環境溫度升高時，其峰值發光波長 λ 會發生何種現象？", "answer": "波長通常變長（紅移）", "wrong": ["波長必定縮短", "波長變為零", "顏色必定變白", "完全不變"], "why": "多數半導體能隙升溫下降，發光波長因此增長。"}, {"id": 66, "unit": "LED 原理與材料", "q": "對於典型 GaAs LED，其發射峰值波長隨溫度的漂移率（dλ/dT）約為多少？", "answer": "約+0.28 nm/°C", "wrong": ["約−10 nm/°C", "約+20 nm/°C", "恆為0 nm/°C", "約+100 nm/°C"], "why": "以GaAs近870nm及能隙溫度係數估算約+0.28 nm/K。"}, {"id": 67, "unit": "LED 原理與材料", "q": "長距離光纖通訊（1.3 µm 與 1.55 µm 傳輸窗口）最核心選用的半導體材料體系為何？", "answer": "InGaAsP／InP", "wrong": ["單晶Si／SiO₂", "純金屬銅", "玻璃／鋁", "GaP／SiN"], "why": "InP基四元合金可覆蓋1.3與1.55μm波段。"}, {"id": 68, "unit": "LED 原理與材料", "q": "在 InP 基板上成長 In₁₋ₓGaₓAsᵞP₁₋ᵞ 四元合金以達成晶格匹配時，元素莫耳分率 x 與 y 需滿足何種經驗關係式？", "answer": "y ≈ 2.2x", "wrong": ["x ≈ 2.2y", "x + y = 0", "x = y² + 5", "x×y = 10"], "why": "題庫指定InP基板晶格匹配近似 y≈2.2x。"}, {"id": 69, "unit": "LED 原理與材料", "q": "若設計一用於長距離光纖通訊 1.3 µm 峰值波長之 In₁₋ₓGaₓAsᵞP₁₋ᵞ LED，其材料之禁帶能隙 Eg（eV）約為多少？", "answer": "約0.95 eV", "wrong": ["約3.4 eV", "約2.0 eV", "約5.0 eV", "約0.1 eV"], "why": "簡化Eg≈1.24/1.3≈0.954eV；若採熱能修正有微差。"}, {"id": 70, "unit": "LED 原理與材料", "q": "承上題，1.3 µm 波長之 In₁₋ₓGaₓAsᵞP₁₋ᵞ 合金經晶格匹配計算後，其化學莫耳組成式為下列何者？", "answer": "In₀.₇₃Ga₀.₂₇As₀.₆₀P₀.₄₀", "wrong": ["In₀.₂₇Ga₀.₇₃As₀.₄₀P₀.₆₀", "In₀.₅Ga₀.₅As₀.₅P₀.₅", "In₁.₀Ga₀.₀As₁.₀P₀.₀", "In₀.₁Ga₀.₉As₀.₁P₀.₉"], "why": "依題庫Eg(y)與y≈2.2x、不含額外熱修正估算；不同修正式組成略有差異。"}, {"id": 71, "unit": "LED 原理與材料", "q": "針對光纖通訊最低衰減損耗窗口 1.55 µm 所設計之 In₁₋ₓGaₓAsᵞP₁₋ᵞ 合金，其最佳化化學莫耳組成式為下列何者？", "answer": "In₀.₆₇Ga₀.₃₃As₀.₇₂P₀.₂₈", "wrong": ["In₀.₃₃Ga₀.₆₇As₀.₂₈P₀.₇₂", "In₀.₉Ga₀.₁As₀.₁P₀.₉", "In₀.₅Ga₀.₅As₀.₅P₀.₅", "In₀.₁Ga₀.₉As₀.₉P₀.₁"], "why": "1.55μm約0.80eV，代入題庫合金模型得近似比例。"}, {"id": 72, "unit": "LED 原理與材料", "q": "光纖通訊用「面發射 LED」（Surface-Emitting LED, SLED / Burrus Type）的主要結構與發光特徵為何？", "answer": "由晶片表面垂直於接面方向出光", "wrong": ["只能沿金屬線傳光", "必須由側邊出光", "只能發射X光", "沒有主動層"], "why": "SLED是面發射元件，光束通常發散較大。"}, {"id": 73, "unit": "LED 原理與材料", "q": "相比於面發射 SLED，「邊緣發射 LED」（Edge-Emitting LED, ELED）具備何種顯著優勢？", "answer": "發光方向性較好、光纖耦合較有利", "wrong": ["完全沒有發散角", "一定比雷射相干", "工作時無電流", "只能產生白光"], "why": "ELED沿波導側向發光，較利於光纖耦合。"}, {"id": 74, "unit": "LED 原理與材料", "q": "在 LED 與光纖介面引入「漸變折射率棒型透鏡」（GRIN Rod Lens）或「微透鏡」（Microlens），其主要目的為何？", "answer": "聚光與改善LED到光纖的耦合效率", "wrong": ["增加材料能隙", "將電流變成交流", "消除電子", "降低光速至零"], "why": "微透鏡改善發散與對準，增加進入光纖的功率。"}, {"id": 75, "unit": "LED 原理與材料", "q": "當半導體材料中的摻雜雜質濃度（Doping Concentration）大幅提高時，載子漂移遷移率（µ）下降的主要機制為何？", "answer": "電離雜質散射增加", "wrong": ["載子完全不帶電", "電子有效質量必為零", "折射率變成負無限", "晶格完全消失"], "why": "高濃度帶電雜質增加載子散射。"}, {"id": 76, "unit": "LED 原理與材料", "q": "在低摻雜的 GaAs 材料中，電子遷移率 µ_e（約 8500 cm²/V·s）與電洞遷移率 µ_h（約 400 cm²/V·s）存在巨大差異，其主要原因為何？", "answer": "電子有效質量較小且散射特性不同", "wrong": ["電子比電洞電荷量大100倍", "電洞完全不受電場影響", "電子不會散射", "電洞都是光子"], "why": "電子與電洞的能帶曲率、散射機制不同。"}, {"id": 77, "unit": "LED 原理與材料", "q": "典型 LED 驅動電流過大時，光輸出功率（P_o）對驅動電流（I_F）曲線會出現飽和現象，其最主要的物理原因為何？", "answer": "自熱與非輻射複合增加導致效率下降", "wrong": ["光子能量隨電流必定無限大", "材料厚度為零", "只有全反射改變", "電流與光無關"], "why": "大電流易造成效率droop與結溫增加，使光功率趨於飽和。"}, {"id": 78, "unit": "LED 原理與材料", "q": "比較近紅外光 LED（如 1.55 µm）與紅光 LED（如 650 nm）的光譜半高寬（Δλ），下列敘述何者正確？", "answer": "同等能量頻寬時1.55μm的Δλ較寬", "wrong": ["650nm必定較寬", "兩者Δλ必為零", "兩者一定完全相同", "無法定義光譜寬度"], "why": "Δλ≈λ²ΔE/(hc)，長波長對應較大的波長寬度。"}, {"id": 79, "unit": "LED 原理與材料", "q": "間接能隙半導體 GaP 經適當摻雜（如 N 或 Zn-O）後可用於製造低成本可見光指示燈，其發光原理為何？", "answer": "摻雜形成發光中心，促進輻射複合", "wrong": ["只有金屬熱輻射", "完全靠雷射受激發射", "沒有電子電洞", "只是全反射"], "why": "GaP可藉雜質中心提高可見光發光機率。"}, {"id": 80, "unit": "LED 原理與材料", "q": "在光纖通訊中，LED 相比於雷射二極體（LD）的主要優缺點比較，下列何者正確？", "answer": "LED便宜易驅動但光譜較寬、方向性較差", "wrong": ["LED比LD更相干且頻寬永遠更窄", "LED一定有更高光纖耦合效率", "LD不能用於長距離", "LED只能在反向偏壓下發光"], "why": "LED適合低成本，LD適合高方向性與高速長距離光鏈路。"}, {"id": 81, "unit": "太陽電池", "q": "結晶矽（c-Si）太陽電池的核心結構本質上是一個大面積的 P-N 接面二極體。當 P 型半導體與 N 型半導體緊密結合時，交界處形成的「內建電場（Built-in Electric Field）」其方向為何？", "answer": "內建電場由N區指向P區", "wrong": ["由P區指向N區", "兩側都指向真空", "永遠為零", "隨波長反轉"], "why": "N側正離子與P側負離子形成N→P電場。"}, {"id": 82, "unit": "太陽電池", "q": "太陽光照射於矽太陽電池產生電子–電洞對（e⁻–h⁺）後，在 P-N 接面內建電場的作用下，載子的漂移（Drift）運動方向為何？", "answer": "電子向N區、電洞向P區", "wrong": ["電子向P區、電洞向N區", "兩者都向P區", "兩者都向N區", "兩者完全不動"], "why": "電子帶負電，漂移方向與電場相反；電洞相同於電場方向。"}, {"id": 83, "unit": "太陽電池", "q": "結晶矽半導體材料在室溫（300 K）下的禁帶寬度/能隙（Bandgap, E_g）約為多少？", "answer": "約1.12 eV", "wrong": ["約0 eV", "約0.2 eV", "約3.4 eV", "約5.5 eV"], "why": "晶體矽300K常用能隙值約1.12eV。"}, {"id": 84, "unit": "太陽電池", "q": "若入射太陽光子的波長 λ 大於切斷波長 λ_g（即光子能量 h·ν < E_g），該光子照射到矽太陽電池上會發生何種物理現象？", "answer": "無法直接產生帶間電子電洞對", "wrong": ["每顆都產生兩組載子", "光必然100%被吸收", "使能隙變零", "必定發出藍光"], "why": "光子能量小於Eg，理想情況不觸發帶間吸收。"}, {"id": 85, "unit": "太陽電池", "q": "高能量短波長光子（如紫光或紫外光，h·ν 遠大於 E_g）被太陽電池吸收後，超出能隙 E_g 的多餘能量主要會以何種形式散失？", "answer": "多餘能量經熱化轉成熱", "wrong": ["全部變成額外電壓", "永遠轉成第二顆光子", "全數儲存不損失", "變成靜止質量"], "why": "熱載子把超額能量傳給晶格聲子。"}, {"id": 86, "unit": "太陽電池", "q": "根據 Shockley-Queisser 極限理論，採用單一 P-N 接面的單接面太陽電池在標準太陽光譜下的理論最高光電轉換效率極限約為多少？", "answer": "約33%～34%", "wrong": ["約5%", "約10%", "約70%", "100%"], "why": "單接面標準太陽光下SQ極限約33.7%。"}, {"id": 87, "unit": "太陽電池", "q": "當太陽電池輸出端接線短路（端電壓 V = 0）時，所量測到的最大輸出電流稱為短路電流（I_sc）。在理想狀態下，I_sc 的數值主要等於下列何者？", "answer": "光生電流Iph", "wrong": ["暗飽和電流I₀必定相等", "開路電壓Voc", "串聯電阻Rs", "入射光波長λ"], "why": "理想短路時電壓為0，Isc約為光生電流。"}, {"id": 88, "unit": "太陽電池", "q": "當太陽電池輸出端開路（輸出電流 I = 0）時，其兩端產生的最大電壓稱為開路電壓（V_oc）。下列關於 V_oc 的敘述何者正確？", "answer": "輸出電流為零時的電壓，通常受光照與溫度影響", "wrong": ["短路時量到的電壓", "永遠不受溫度影響", "Voc等於Isc", "永遠等於材料能隙的10倍"], "why": "Voc是開路端電壓，受光生電流與暗飽和電流影響。"}, {"id": 89, "unit": "太陽電池", "q": "填滿因子（Fill Factor, FF）是評估太陽電池品質與 I-V 曲線矩形飽和度的關鍵指標，其數學定義表達式為何？", "answer": "FF = (Vmp Imp)/(Voc Isc)", "wrong": ["FF = Voc/Isc", "FF = Vmp+Imp", "FF = Rs/Rsh", "FF = Eg/λ"], "why": "填滿因子為最大功率對Voc×Isc之比。"}, {"id": 90, "unit": "太陽電池", "q": "光電轉換效率（Power Conversion Efficiency, η）代表太陽電池將光能轉換為電能的百分比。在標準測試條件（STC）下，入射太陽光功率密度 P_in 設定為多少？", "answer": "1000 W/m²（100 mW/cm²）", "wrong": ["10 W/m²", "100 W/m²", "10000 W/m²", "1 W/m²"], "why": "STC標準輻照度為1000W/m²（電池溫度25°C）。"}, {"id": 91, "unit": "太陽電池", "q": "關於「外部量子效率（EQE）」與「內部量子效率（IQE）」的差別，下列關係何者正確？（其中 R 為電池表面光反射率）", "answer": "忽略穿透與其他損失時 EQE=(1−R)IQE", "wrong": ["EQE=IQE/(1−R)必然成立", "EQE=IQE+R", "EQE=R/IQE", "EQE永遠為零"], "why": "EQE以入射光子為基準；IQE以實際吸收光子為基準。"}, {"id": 92, "unit": "太陽電池", "q": "在光學響應度 SR(λ)（單位 A/W）隨波長 λ 變化的特性曲線中，當量子效率 EQE 保持恆定時，SR 與波長 λ 的物理關係為何？", "answer": "EQE恆定時SR與波長λ成正比", "wrong": ["SR與λ成反比", "SR與λ²成反比", "SR完全不隨λ變", "SR與λ無關且必為零"], "why": "SR=(qλ/hc)EQE。"}, {"id": 93, "unit": "太陽電池", "q": "當太陽電池的工作溫度上升時，二極體暗飽和電流 I₀ 會呈指數級大幅劇增，這會導致太陽電池的哪一個輸出參數發生最顯著的下降？", "answer": "開路電壓Voc明顯下降", "wrong": ["光速大幅下降", "太陽電池面積歸零", "能隙突然無限大", "短路電流必然歸零"], "why": "暗飽和電流升高，使Voc降低。"}, {"id": 94, "unit": "太陽電池", "q": "結晶矽太陽電池的發電功率隨工作溫度升高的衰減率（功率溫度係數）約為多少？", "answer": "約−0.4%至−0.5%／°C", "wrong": ["約+10%／°C", "約+2%／°C", "恆為0%／°C", "約−50%／°C"], "why": "一般結晶矽升溫功率降低，現代電池數值可依技術不同而變。"}, {"id": 95, "unit": "太陽電池", "q": "太陽電池內部的寄生串聯電阻（Series Resistance, R_s）主要源自於體電阻、電極接觸電阻與導線阻抗。當 R_s 過大時，主要會對 I-V 特性曲線造成何種扭曲？", "answer": "造成負載電流下壓降、FF和最大功率下降", "wrong": ["讓FF固定等於1", "使電壓無限大", "使Isc等於Voc", "完全不影響I-V曲線"], "why": "過大Rs使I-V曲線膝部變圓、最大輸出下降。"}, {"id": 96, "unit": "太陽電池", "q": "太陽電池內部的寄生分流電阻（Shunt Resistance, R_sh）主要源於 P-N 接面缺陷與邊緣漏電。理想太陽電池的 R_sh 數值應為何？高品質商業電池要求 R_sh 應達到多少以上？", "answer": "理想Rsh為無限大，實際應盡可能高", "wrong": ["理想Rsh為零", "理想Rsh等於Rs", "Rsh越小越好", "理想Rsh為負值"], "why": "漏電路徑越少Rsh越大；實際門檻視面積及電池規格而定。"}, {"id": 97, "unit": "太陽電池", "q": "商業化矽太陽電池製造流程中，在矽晶圓正面利用化學氣相沉積（PECVD）鍍上一層氮化矽（SiN_x）薄膜的主要功能為何？", "answer": "抗反射與表面鈍化", "wrong": ["形成金屬導線", "增加表面反射", "把矽變成鍺", "使電池只能在夜晚發電"], "why": "SiNx減少反射和表面複合。"}, {"id": 98, "unit": "太陽電池", "q": "在標準結晶矽太陽電池的結構設計中，N 型射極層（N-type Emitter）的典型厚度通常設計為多少？其原因為何？", "answer": "傳統擴散式射極約0.1～1μm，兼顧收集與電阻", "wrong": ["約10cm以增加重量", "越厚越好且無上限", "一定只有1nm", "厚度需大於晶圓本體"], "why": "淺射極可降低表面載子複合損失，也須兼顧片電阻及接觸。"}, {"id": 99, "unit": "太陽電池", "q": "若光生電子–電洞對產生於離 P-N 接面較遠的中性 P 區深處，該載子主要依靠何種物理機制移動至 P-N 接面邊界？其成功被接面收集的前提條件為何？", "answer": "靠少數載子擴散，須在複合前到達接面", "wrong": ["只靠全反射", "只靠熱對流", "載子必須先成為光子", "載子不可能移動"], "why": "中性區主要靠濃度梯度擴散，擴散長度與壽命影響收集。"}, {"id": 100, "unit": "太陽電池", "q": "下列關於太陽電池寄生電阻對最大輸出功率損耗之估算關係，何者正確？（其中 r_s = R_s / (V_oc / I_sc) 代表正規化串聯電阻）", "answer": "小Rs時可近似FF≈FF₀(1−rₛ)，rₛ=Rs/(Voc/Isc)", "wrong": ["FF必定隨Rs增加", "rₛ=Rsh×Voc", "Rs越大Pmax越高", "所有電阻皆不影響功率"], "why": "串聯電阻引起負載壓降，低rₛ下FF損失近似正比於rₛ。"}]</script><script>
(()=>{'use strict';const Q=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);const KEY='opto_quiz_progress_v1',WRONG='opto_quiz_wrong_v1',STATS='opto_quiz_stats_v1';let state=null,unit='all',currentWrong=[];const get=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const show=id=>{for(let x of ['home','play','result'])$(x).classList.toggle('hide',x!==id);window.scrollTo({top:0,behavior:'instant'})};const unitMatch=q=>unit==='all'||unit==='optics'&&q.id<=50||unit==='led'&&q.id>=51&&q.id<=80||unit==='solar'&&q.id>=81||unit==='wrong'&&get(WRONG,[]).includes(q.id);const safe=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));function home(){show('home');$('resume').classList.toggle('hide',!get(KEY,null));let s=get(STATS,{sessions:0,correct:0,total:0});$('history').textContent=`已完成 ${s.sessions} 場挑戰，累計答對 ${s.correct} / ${s.total} 題；歷史錯題 ${get(WRONG,[]).length} 題。`}
function launch(ids=null){let selected=ids?Q.filter(q=>ids.includes(q.id)):Q.filter(unitMatch);if(!selected.length){alert('此範圍目前沒有題目（若選歷史錯題，請先完成測驗）。');return}let mode=ids?'all':$('mode').value;selected=mode==='ordered'?selected:shuffle(selected);if(mode==='random10')selected=selected.slice(0,10);if(mode==='random20')selected=selected.slice(0,20);state={ids:selected.map(x=>x.id),index:0,answers:{},options:{},completed:false,unit,mode};put(KEY,state);render()}
function current(){return Q[state.ids[state.index]-1]}function getOpts(q){let a=state.options[q.id];if(!a){a=shuffle([q.answer,...q.wrong]);state.options[q.id]=a;put(KEY,state)}return a}function render(){if(!state){home();return}if(state.index>=state.ids.length){finish();return}show('play');let q=current(),ans=state.answers[q.id],a=getOpts(q);$('section').textContent=q.unit;$('counter').textContent=`第 ${state.index+1} / ${state.ids.length} 題`;$('qno').textContent=`原題 Q${q.id}`;$('score').textContent=Object.keys(state.answers).filter(k=>state.answers[k]===Q[+k-1].answer).length;$('bar').style.width=`${(state.index+(ans!==undefined?1:0))/state.ids.length*100}%`;$('question').textContent=q.q;let root=$('options');root.innerHTML='';a.forEach((option,i)=>{let btn=document.createElement('button');btn.className='option';let letter=document.createElement('span');letter.className='letter';letter.textContent='ABCDE'[i];let val=document.createElement('span');val.textContent=option;btn.append(letter,val);if(ans!==undefined){btn.disabled=true;if(option===q.answer)btn.classList.add('correct');else if(option===ans)btn.classList.add('wrong')}else btn.addEventListener('click',()=>answer(option));root.append(btn)});let f=$('feedback');f.classList.toggle('hide',ans===undefined);$('next').classList.toggle('hide',ans===undefined);if(ans!==undefined){let ok=ans===q.answer;f.className='answer '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✅ 答對了！':'❌ 答錯了，再記一次！'}</strong><div>正確答案：${safe(q.answer)}</div><div class="note">${safe(q.why)}</div>`;$('next').textContent=state.index===state.ids.length-1?'查看結果 🏆':'下一題 →'} }
function answer(option){let q=current();if(state.answers[q.id]!==undefined)return;state.answers[q.id]=option;let w=new Set(get(WRONG,[]));if(option===q.answer)w.delete(q.id);else w.add(q.id);put(WRONG,[...w]);put(KEY,state);render()}
function finish(){if(state.completed)return;state.completed=true;put(KEY,state);let total=state.ids.length,correct=state.ids.filter(id=>state.answers[id]===Q[id-1].answer).length,wrong=state.ids.filter(id=>state.answers[id]!==Q[id-1].answer);currentWrong=wrong;let s=get(STATS,{sessions:0,correct:0,total:0});s.sessions++;s.correct+=correct;s.total+=total;put(STATS,s);localStorage.removeItem(KEY);$('resultTitle').textContent=correct===total?'全對！完美通關 🎉':correct/total>=.8?'表現很好，繼續保持！':'錯題就是升級的機會';$('percent').textContent=Math.round(correct/total*100)+'%';$('summary').textContent=`答對 ${correct} / ${total} 題｜答錯 ${wrong.length} 題`;let r=$('review');r.innerHTML='';$('redoWrong').disabled=wrong.length===0;$('reviewDetail').classList.add('hide');if(!wrong.length)r.textContent='沒有錯題，太厲害了！';wrong.forEach(id=>{let q=Q[id-1],b=document.createElement('button');b.textContent=`Q${id}｜${q.q.slice(0,48)}…`;b.addEventListener('click',()=>{$('reviewDetail').classList.remove('hide');$('reviewDetail').innerHTML=`<strong>Q${id}｜${safe(q.q)}</strong><p>你的答案：${safe(state.answers[id]||'未作答')}</p><p>正確答案：${safe(q.answer)}</p><p>${safe(q.why)}</p>`;$('reviewDetail').scrollIntoView({behavior:'smooth',block:'nearest'})});r.append(b)});show('result')}
$('units').addEventListener('click',e=>{let b=e.target.closest('[data-unit]');if(!b)return;unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('active',x===b))});$('start').onclick=()=>launch();$('resume').onclick=()=>{state=get(KEY,null);if(state)render()};$('next').onclick=()=>{state.index++;put(KEY,state);if(state.index===state.ids.length)finish();else render()};$('leave').onclick=home;$('again').onclick=()=>{unit='all';home()};$('backHome').onclick=home;$('redoWrong').onclick=()=>launch(currentWrong);$('clear').onclick=()=>{if(confirm('確定要清除測驗進度、成績與歷史錯題嗎？')){[KEY,WRONG,STATS].forEach(k=>localStorage.removeItem(k));home()}};home();})();
</script></body></html>
